<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小车双摄预览</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#111827;color:#e5e7eb}
*{box-sizing:border-box}body{margin:0;padding:18px}header,main{max-width:1680px;margin:auto}header{margin-bottom:18px}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0}p{line-height:1.5;margin:8px 0;color:#9ca3af}a{color:#93c5fd}button,input{font:inherit}button{border:1px solid #4b5563;border-radius:7px;background:#374151;color:#f9fafb;padding:9px 13px;cursor:pointer}button:hover{background:#4b5563}input{min-width:0;border:1px solid #6b7280;border-radius:7px;background:#111827;color:#f9fafb;padding:9px;width:100%}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:18px;align-items:start}.card{min-width:0;border:1px solid #374151;border-radius:12px;background:#172030;overflow:hidden}.card-head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #374151}.card-head a{font-size:14px;white-space:nowrap}.maix-frame{display:block;border:0;width:100%;height:calc(100dvh - 210px);min-height:440px;background:#111827}.aux{position:sticky;top:18px}.aux-body{padding:14px}.camera-view{position:relative;background:#0b111c;border:1px solid #374151;border-radius:8px;overflow:hidden;aspect-ratio:4/3}.camera-view img{display:block;width:100%;height:100%;object-fit:contain}.camera-view img[hidden]{display:none}.placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#9ca3af}.placeholder[hidden]{display:none}.guide{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.8%,#38bdf8 50%,transparent 50.2%),linear-gradient(transparent 49.8%,#38bdf8 50%,transparent 50.2%)}.guide[hidden]{display:none}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{font-size:14px;min-height:1.5em;color:#9ca3af}.status.online{color:#86efac}details{margin-top:14px;color:#9ca3af;font-size:14px}summary{cursor:pointer}form{display:flex;gap:8px;margin-top:10px}form button{white-space:nowrap}.maix-empty{min-height:220px;padding:24px;color:#9ca3af}.maix-empty[hidden],iframe[hidden],a[hidden]{display:none}#address-error{color:#fca5a5}
@media(max-width:700px){body{padding:12px}main{grid-template-columns:1fr}.aux{position:static}.maix-frame{height:65dvh;min-height:420px}.card-head{padding:12px}.aux-body{padding:12px}}
</style>
</head>
<body>
<header><h1>小车双摄预览</h1><p>Maix 巡线控制台 · ESP32 发车灯</p></header>
<main>
<section class="card" aria-labelledby="maix-title">
<div class="card-head"><h2 id="maix-title">MaixCAM2</h2><a id="maix-open" target="_blank" rel="noopener noreferrer" hidden>单独打开控制台 ↗</a></div>
<div id="maix-empty" class="maix-empty">填写下方 Maix 地址，即可在这里打开巡线控制台。</div>
<iframe id="maix-frame" class="maix-frame" title="MaixCAM2 巡线控制台" referrerpolicy="no-referrer" hidden></iframe>
<div style="padding:0 14px 14px"><details id="maix-settings"><summary>Maix 连接地址</summary><form id="maix-form"><input id="maix-address" aria-label="Maix 控制台地址" placeholder="http://设备IP:8000/" spellcheck="false"><button type="submit">连接</button></form><p id="address-error" role="status"></p></details></div>
</section>
<section class="card aux" aria-labelledby="esp-title">
<div class="card-head"><h2 id="esp-title">ESP32</h2><span id="esp-transport" style="font-size:14px;color:#9ca3af">USB</span></div>
<div class="aux-body">
<div class="camera-view"><img id="esp-camera" alt="ESP32 实时画面" hidden><div id="esp-placeholder" class="placeholder">正在连接摄像头…</div><div id="signal-roi" style="position:absolute;left:25%;top:0%;width:50%;height:53.333333%;border:2px solid cyan;box-sizing:border-box;pointer-events:none" aria-label="发车灯定位框"></div><div id="guide" class="guide" hidden></div></div>
<p id="esp-status" class="status" role="status">等待画面</p>
<div class="buttons"><button id="esp-toggle">暂停</button><button id="esp-reconnect">重新连接</button><button id="esp-guide" aria-pressed="false">参考线</button></div>
<p style="font-size:14px">将完整亮灯放入青色框，再在 Maix 控制台按 ARM；锁定后等待熄灯。ESP32 检测灯光，Maix 决定发车。</p>
<p><a id="wifi-settings" hidden>无线设置</a></p><details><summary>无线回传说明</summary><p>Wi-Fi 模式通过网络接收 ESP32 画面，不使用 USB 传图。摄像头仍需供电，且与 Maix、电脑保持网络互通。</p></details>
</div>
</section>
</main>
<script>
const config = __PREVIEW_CONFIG__;
const transport=config.transport||"USB";
document.getElementById("esp-transport").textContent=transport;
if(config.setupUrl){const link=document.getElementById("wifi-settings");link.href=config.setupUrl;link.hidden=false;}
const maixFrame=document.getElementById('maix-frame'),maixOpen=document.getElementById('maix-open'),maixAddress=document.getElementById('maix-address');
function connectMaix(value){
 const input=value.trim();
 try{
  const url=new URL(input);
  if(!['http:','https:'].includes(url.protocol)||!url.hostname||url.username||url.password)throw Error('invalid');
  maixFrame.src=url.href;maixFrame.hidden=false;
  maixOpen.href=url.href;maixOpen.hidden=false;
  document.getElementById('maix-empty').hidden=true;
  document.getElementById('maix-settings').open=false;
  document.getElementById('address-error').textContent='';
  try{localStorage.setItem('robot-maix-preview-url',url.href)}catch(e){}
 }catch(e){document.getElementById('address-error').textContent='请输入有效的 http:// 或 https:// 地址。';}
}
let initialMaix=config.maixUrl||'';
if(!initialMaix){try{initialMaix=localStorage.getItem('robot-maix-preview-url')||''}catch(e){}}
maixAddress.value=initialMaix;
if(initialMaix)connectMaix(initialMaix);else document.getElementById('maix-settings').open=true;
document.getElementById('maix-form').addEventListener('submit',event=>{event.preventDefault();connectMaix(maixAddress.value)});
const picture=document.getElementById('esp-camera'),placeholder=document.getElementById('esp-placeholder'),statusBox=document.getElementById('esp-status'),toggle=document.getElementById('esp-toggle');
let paused=false,polling=false,online=false;
function hidePicture(message){picture.removeAttribute('src');picture.hidden=true;placeholder.textContent=message;placeholder.hidden=false;}
function showPicture(){
 if(paused){hidePicture('已暂停预览');return;}
 if(!online)return;
 if(!picture.hasAttribute('src'))picture.src='/stream?t='+Date.now();
 picture.hidden=false;placeholder.hidden=true;
}
async function refreshStatus(){
 if(polling)return;polling=true;
 try{
  const response=await fetch('/status',{cache:'no-store',signal:AbortSignal.timeout(1500)});
  if(!response.ok)throw Error('unavailable');
  const state=await response.json();
  online=state.connected&&!state.error&&Number.isFinite(state.age_ms)&&state.age_ms<=5000;
  statusBox.classList.toggle('online',online);
  statusBox.textContent=online?'画面正常 · '+state.frames+' 帧':state.error?transport+' 未连接，等待恢复':'正在等待摄像头画面…';
  if(online)showPicture();else hidePicture(state.error?'连接中断，自动重连中':'正在连接摄像头…');
 }catch(e){online=false;statusBox.classList.remove('online');statusBox.textContent='预览服务连接中断';hidePicture('等待预览服务恢复');}
 finally{polling=false;}
}
toggle.addEventListener('click',()=>{paused=!paused;toggle.textContent=paused?'继续':'暂停';showPicture();});
document.getElementById('esp-reconnect').addEventListener('click',()=>{paused=false;toggle.textContent='暂停';picture.removeAttribute('src');refreshStatus();});
document.getElementById('esp-guide').addEventListener('click',event=>{const guide=document.getElementById('guide');guide.hidden=!guide.hidden;event.currentTarget.setAttribute('aria-pressed',String(!guide.hidden));});
picture.addEventListener('error',()=>{picture.removeAttribute('src');picture.hidden=true;placeholder.textContent='正在重新连接画面…';placeholder.hidden=false;});
refreshStatus();setInterval(refreshStatus,750);
</script>
</body>
</html>
