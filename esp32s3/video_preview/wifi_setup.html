<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32 无线设置</title>
<style>:root{font:16px system-ui;color-scheme:dark;background:#111827;color:#e5e7eb}body{max-width:560px;margin:40px auto;padding:0 20px}h1{font-size:26px}p{line-height:1.6;color:#9ca3af}form{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:22px}label{display:block;margin:0 0 18px}input{display:block;box-sizing:border-box;width:100%;font:inherit;margin-top:8px;padding:12px;background:#111827;color:#f9fafb;border:1px solid #6b7280;border-radius:7px}button{padding:12px 20px;font:inherit;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#93c5fd}#status{min-height:3em;color:#fcd34d}small{color:#9ca3af;line-height:1.6}</style>
<h1>ESP32 无线设置</h1><p>让摄像头接入与 Maix 互通的 2.4GHz Wi-Fi。首次设置暂用 USB；连接后，画面通过 Wi-Fi 回传。</p>
<form id="setup-form"><label>Wi-Fi 名称<input id="ssid" name="ssid" required maxlength="32" autocomplete="off" spellcheck="false"></label><label>Wi-Fi 密码<input id="password" name="password" type="password" maxlength="64" autocomplete="off"></label><button id="connect" type="submit">连接 Wi-Fi</button><p id="status" role="status" aria-live="polite">请填写密码后连接。</p><small>设置只发送到当前 USB 连接的 ESP32，保存到摄像头；密码不写入项目文件。</small></form><p><a href="/">返回双摄预览</a></p>
<script>
const config=__SETUP_CONFIG__;
const ssid=document.getElementById('ssid'),password=document.getElementById('password'),button=document.getElementById('connect'),statusBox=document.getElementById('status');
ssid.value=config.ssid||'';
let polling=false,submitted=false;
function busy(value){button.disabled=value;ssid.disabled=value;password.disabled=value;}
async function update(){
 if(polling)return;polling=true;
 try{const r=await fetch('/setup/status',{cache:'no-store',signal:AbortSignal.timeout(2000)});if(!r.ok)throw Error();const state=await r.json();if(state.phase==='connecting')submitted=true;busy(state.phase==='connecting');statusBox.textContent=state.message;if(state.phase==='ready'&&submitted)location.replace('/');}
 catch(e){busy(false);statusBox.textContent='本机设置服务暂时不可用，请稍后重试。';}
 finally{polling=false;}
}
document.getElementById('setup-form').addEventListener('submit',async event=>{
 event.preventDefault();const values={ssid:ssid.value,password:password.value};password.value='';busy(true);statusBox.textContent='正在连接…';
 try{const r=await fetch('/setup',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':config.token},body:JSON.stringify(values),signal:AbortSignal.timeout(3000)});values.password='';const answer=await r.json();if(!r.ok)throw Error(answer.message||'设置未完成');submitted=true;await update();}
 catch(e){values.password='';busy(false);statusBox.textContent=e.message||'设置未完成，请重试。';}
});
update();setInterval(update,1000);
</script></html>
